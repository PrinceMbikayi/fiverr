// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext {
        googlePlayServicesVersion = "+" // default: "+"
        firebaseVersion = "33.5.1" // Latest Firebase version
        buildToolsVersion = "35.0.0"
        minSdkVersion = 24
        compileSdkVersion = 35
        targetSdkVersion = 35 
        renderscriptVersion = 21
        googlePlayServicesAuthVersion = "21.2.0"
        ndkVersion = "27.2.12479018" // Latest NDK
        kotlinVersion = '2.1.0' // Latest Kotlin version

        if (System.properties['os.arch'] == "aarch64") {
            // For M1 Users - latest NDK supports aarch64
            ndkVersion = "27.2.12479018"
        } else {
            // Latest NDK for all architectures
            ndkVersion = "27.2.12479018"
        }
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:8.7.3") 
        classpath("de.undercouch:gradle-download-task:5.4.0")       
        classpath 'com.google.firebase:firebase-crashlytics-gradle:3.0.2'
        classpath 'com.google.gms:google-services:4.4.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:2.1.0" // Latest Kotlin
        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

def REACT_NATIVE_VERSION = new File(['node', '--print',"JSON.parse(require('fs').readFileSync(require.resolve('react-native/package.json'), 'utf-8')).version"].execute(null, rootDir).text.trim())

allprojects {
    configurations.all {
        resolutionStrategy {
            // Remove this override in 0.65+, as a proper fix is included in react-native itself.
            force "com.facebook.react:react-native:" + REACT_NATIVE_VERSION
        }
    }
    repositories {
        mavenLocal()
        maven {
            // All of React Native (JS, Obj-C sources, Android binaries) is installed from npm
            url("$rootDir/../node_modules/react-native/android")
        }
        maven {
            // Android JSC is installed from npm
            url("$rootDir/../node_modules/jsc-android/dist")
        }
         maven {
            url "$rootDir/../node_modules/@notifee/react-native/android/libs"
        }
        mavenCentral {
            // We don't want to fetch react-native from Maven Central as there are
            // older versions over there.
            content {
                excludeGroup "com.facebook.react"
            }
        }
        google()
        jcenter()
        maven { url 'https://jitpack.io' }
    }
    
    // Fix for AGP 8.0+ buildConfig requirement for all Android libraries
    pluginManager.withPlugin("com.android.library") {
        android {
            buildFeatures {
                buildConfig true
            }
            
            // Fix namespace issues for specific libraries with AGP 8.0+
            if (project.name == "react-native-bluetooth-state-manager") {
                namespace 'de.patwoz.rn.bluetoothstatemanager'
            }
            if (project.name == "react-native-community_art") {
                namespace 'com.reactnativecommunity.art'
            }
            if (project.name == "react-native-community_toolbar-android") {
                namespace 'com.reactnativecommunity.toolbarandroid'
            }
            if (project.name == "react-native-date-picker") {
                namespace 'com.henninghall.date_picker'
            }
            if (project.name == "react-native-exception-handler") {
                namespace 'com.masteratul.exceptionhandler'
            }
            if (project.name == "react-native-image-picker") {
                namespace 'com.imagepicker'
            }
            if (project.name == "react-native-video") {
                namespace 'com.brentvatne.react'
            }
            if (project.name == "react-native-webview") {
                namespace 'com.reactnativecommunity.webview'
            }
            if (project.name == "react-native-camera") {
                namespace 'org.reactnative.camera'
            }
            if (project.name == "react-native-vector-icons") {
                namespace 'com.oblador.vectoricons'
            }
            if (project.name == "react-native-ble-manager") {
                namespace 'it.innove'
            }
            if (project.name == "react-native-blob-util") {
                namespace 'com.ReactNativeBlobUtil'
            }
            if (project.name == "react-native-bootsplash") {
                namespace 'com.zoontek.rnbootsplash'
            }
            if (project.name == "react-native-community_checkbox") {
                namespace 'com.reactnativecommunity.checkbox'
            }
            if (project.name == "react-native-community_datetimepicker") {
                namespace 'com.reactcommunity.rndatetimepicker'
            }
            if (project.name == "react-native-community_geolocation") {
                namespace 'com.reactnativecommunity.geolocation'
            }
            if (project.name == "react-native-community_netinfo") {
                namespace 'com.reactnativecommunity.netinfo'
            }
            if (project.name == "react-native-community_slider") {
                namespace 'com.reactnativecommunity.slider'
            }
            if (project.name == "react-native-config") {
                namespace 'com.lugg.ReactNativeConfig'
            }
            if (project.name == "react-native-device-info") {
                namespace 'com.learnium.RNDeviceInfo'
            }
            if (project.name == "react-native-flipper") {
                namespace 'com.reactnativeflipper'
