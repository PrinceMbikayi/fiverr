// Top-level build file where you can add configuration options common to all sub-projects/modules.

// 2021-09-06 : 
// - compileSdKVersin from 29 to 31
// - targetSdkVersion from 29 to 31 // then changed to 30 for trampoline issue
// - buildToolsVersion from 29.0.3 to 31.0.0

buildscript {
    ext {
        googlePlayServicesVersion = "+" // default: "+"
        firebaseVersion = "32.3.1" // was 21.0.0 ||  default: "+"
        buildToolsVersion = "34.0.0"
        minSdkVersion = 24
        compileSdkVersion = 34
        targetSdkVersion = 34 
        renderscriptVersion = 21
        googlePlayServicesAuthVersion = "20.7.0"
        ndkVersion = "25.1.8937393"
        kotlinVersion = '1.9.20' // <- add this line


        if (System.properties['os.arch'] == "aarch64") {
            // For M1 Users we need to use the NDK 24 which added support for aarch64
            ndkVersion = "24.0.8215888"
        } else {
            // Otherwise we default to the side-by-side NDK version from AGP.
            ndkVersion = "21.4.7075529"
        }
        
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
       
        classpath("com.android.tools.build:gradle:8.2.1") 
        classpath("de.undercouch:gradle-download-task:5.4.0")       
        classpath 'com.google.firebase:firebase-crashlytics-gradle:2.9.9'
        classpath 'com.google.gms:google-services:4.4.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.20" // <- add this line
        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

def REACT_NATIVE_VERSION = new File(['node', '--print',"JSON.parse(require('fs').readFileSync(require.resolve('react-native/package.json'), 'utf-8')).version"].execute(null, rootDir).text.trim())


allprojects {
    configurations.all {
        resolutionStrategy {
            // Remove this override in 0.65+, as a proper fix is included in react-native itself.
            force "com.facebook.react:react-native:" + REACT_NATIVE_VERSION
            //force 'com.facebook.flipper:flipper-fresco-plugin:0.125.0'
        }
    }
    repositories {
        mavenLocal()
        maven {
            // All of React Native (JS, Obj-C sources, Android binaries) is installed from npm
            url("$rootDir/../node_modules/react-native/android")
        }
        maven {
            // Android JSC is installed from npm
            url("$rootDir/../node_modules/jsc-android/dist")
        }
         maven {
            url "$rootDir/../node_modules/@notifee/react-native/android/libs"
        }
        mavenCentral {
            // We don't want to fetch react-native from Maven Central as there are
            // older versions over there.
            content {
                excludeGroup "com.facebook.react"
            }
        }
        google()
        jcenter()
        maven { url 'https://jitpack.io' }
        
    }
    
    // Fix for AGP 8.0+ buildConfig requirement for all Android libraries
    pluginManager.withPlugin("com.android.library") {
        android {
            buildFeatures {
                buildConfig true
            }
            
            // Fix namespace issues for specific libraries with AGP 8.0+
            if (project.name == "react-native-bluetooth-state-manager") {
                namespace 'de.patwoz.rn.bluetoothstatemanager'
            }
            if (project.name == "react-native-community_art") {
                namespace 'com.reactnativecommunity.art'
            }
            if (project.name == "react-native-community_toolbar-android") {
                namespace 'com.reactnativecommunity.toolbarandroid'
            }
        }
    }
}

